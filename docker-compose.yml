# Local PostgreSQL for development (bound to localhost only).
#
#   docker compose up -d        # start
#   npm run db:push             # create tables
#   docker compose down         # stop  (add -v to also wipe data)
#
# Connect from IntelliJ (Database tool):
#   Host: localhost   Port: 5433   Database: spendwise
#   User: spendwise   Password: spendwise

services:
  db:
    image: postgres:16-alpine
    container_name: spendwise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: spendwise
      POSTGRES_DB: spendwise
    ports:
      # localhost-only so the database is never exposed to the network.
      # Host port 5433 (container 5432) to avoid clashing with any other
      # Postgres already running on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendwise -d spendwise"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
